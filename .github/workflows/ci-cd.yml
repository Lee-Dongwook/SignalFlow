name: Flink Pipeline CI/CD

on:
  push:
    branches: ["main"]
    paths:
      - "apps/flink_jobs/**"
      - "k8s/**"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: lee-dongwook/signalflow/flink-jobs

permissions:
  contents: write
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{env.REGISTRY}}
          username: ${{github.actor}}
          password: ${{secrets.GITHUB_TOKEN}}

      - name: Extract Metadata (Tags/Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{env.REGISTRY}}/${{env.IMAGE_NAME}}
          tags: |
            type=sha,format=short,prefix=
            type=raw,value=latest

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/flink_jobs
          file: ./apps/flink_jobs/Dockerfile
          push: true
          tags: ${{steps.meta.outputs.tags}}
          labels: ${{steps.meta.outputs.labels}}

      - name: Update K8s manifest
        run: |
          SHORT_SHA=$(echo ${{github.sha}} | cut -c1-7)
          sed -i "s|image: ghcr.io/.*:.*|image: ${{env.REGISTRY}}/${{env.IMAGE_NAME}}:${SHORT_SHA}|g" k8s/manifests/flink-jobmanager.yml

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/manifests/flink-jobmanager.yml
          git diff --cached --quiet && exit 0
          git commit -m "chore(deps): update flink image tag to ${SHORT_SHA} [skip ci]"
          git push
