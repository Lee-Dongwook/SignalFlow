name: Trigger Jenkins CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  trigger-jenkins:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Jenkins pipeline
        env:
          JENKINS_URL: ${{ secrets.JENKINS_URL }}
          JENKINS_USER: ${{ secrets.JENKINS_USER }}
          JENKINS_API_TOKEN: ${{ secrets.JENKINS_API_TOKEN }}
          JENKINS_JOB_PATH: ${{ secrets.JENKINS_JOB_PATH }}
        run: |
          : "${JENKINS_URL:?Set the JENKINS_URL repository secret.}"
          : "${JENKINS_USER:?Set the JENKINS_USER repository secret.}"
          : "${JENKINS_API_TOKEN:?Set the JENKINS_API_TOKEN repository secret.}"
          : "${JENKINS_JOB_PATH:?Set the JENKINS_JOB_PATH repository secret.}"

          JOB_URL=$(printf '%s' "$JENKINS_JOB_PATH" | sed 's#/#/job/#g')
          curl --fail --silent --show-error \
            --user "$JENKINS_USER:$JENKINS_API_TOKEN" \
            --request POST \
            --data-urlencode "GIT_SHA=${{ github.sha }}" \
            --data-urlencode "GIT_REF=${{ github.ref }}" \
            "${JENKINS_URL%/}/job/${JOB_URL}/buildWithParameters"
