name: SignalFlow Production GitOps CI/CD

on:
  push:
    branches: [main]

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python & Node.js
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate Protobuf Schemas
        run: |
          pip install protobuf
          protoc --python_out=. schemas/event_schema_v1.proto
      - name: Build Dashboard & Backend API Images
        run: |
          docker build -t registry.signalflow.io/dashboard:${{ github.sha }} -f apps/dashboard/Dockerfile .
          docker build -t registry.signalflow.io/backend-api:${{ github.sha }} -f apps/backend_api/Dockerfile .
      - name: Update Helm Chart Values
        run: |
          sed -i 's/tag: .*/tag: "${{ github.sha }}"/' k8s/helm/values.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(deploy): update image tag to ${{ github.sha }}"
          git push
