name: SignalFlow Build CI

on:
  push:
    branches: [main]

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python & Node.js
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate Protobuf Schemas
        run: |
          pip install "grpcio-tools>=1.60.0,<1.63.0"
          python -m grpc_tools.protoc -I. --python_out=. schemas/event_schema_v1.proto

      - name: Build Dashboard & Backend API Images
        run: |
          docker build -t registry.signalflow.io/dashboard:${{ github.sha }} -f apps/dashboard/Dockerfile .
          docker build -t registry.signalflow.io/backend-api:${{ github.sha }} -f apps/backend_api/Dockerfile .
