apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: signalflow-production
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/Lee-Dongwook/signalflow.git"
    targetRevision: HEAD
    path: k8s/helm
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: "https://kubernetes.default.svc"
    namespace: signalflow
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
