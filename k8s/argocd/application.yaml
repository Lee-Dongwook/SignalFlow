apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: signalflow-platform
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/Lee-Dongwook/SignalFlow.git"
    targetRevision: HEAD
    path: k8s/manifests
  destination:
    server: "https://kubernetes.default.svc"
    namespace: flink
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
