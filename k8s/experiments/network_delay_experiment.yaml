apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: vllm-latency-injection
  namespace: signalflow
spec:
  action: delay
  mode: all
  selector:
    namespaces:
      - signalflow
    labelSelectors:
      "app": "vllm"
  delay:
    latency: "2000ms"
    jitter: "200ms"
  direction: to
