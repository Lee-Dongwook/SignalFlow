[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=61.0"]

[project]
name = "signalflow"
version = "0.1.0"
description = "SignalFlow Self-Healing Multi-Agent System"
requires-python = ">=3.10"
dependencies = [
    "confluent-kafka>=2.3.0",
    "fastapi>=0.110.0",
    "protobuf>=4.25.0",
    "psycopg-pool>=3.2.0",
    "psycopg[binary]>=3.1.0",
    "redis>=5.0.0",
    "sse-starlette>=2.0.0",
    "tenacity>=8.2.0",
    "uvicorn>=0.28.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
