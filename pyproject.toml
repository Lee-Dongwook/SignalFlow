[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "signalflow"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "confluent-kafka>=2.3.0",
    "protobuf>=4.25.0",
    "tenacity>=8.2.0",
    "sse-starlette>=2.0.0",
    "psycopg-pool>=3.2.0",
    "psycopg[binary]>=3.1.0",
    "redis>=5.0.0",
]

[tool.ruff]
target-version = "py310"
line-length = 100
