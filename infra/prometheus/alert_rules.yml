groups:
  - name: signalflow_pipeline_sla
    rules:
      - alert: PipelineP99SLAExceeded
        expr: histogram_quantile(0.99, sum(rate(flink_taskmanager_job_latency_bucket[5m])) by (le)) > 300
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Flink Stream Processing P99 Latency > 300ms"
          description: "Current P99 Latency is {{ $value }}ms, exceeding the 300ms SLA target."

      - alert: KafkaConsumerLagSpike
        expr: sum(kafka_consumergroup_lag{consumergroup="flink-intelligence-group"}) > 50000
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Kafka Consumer Lag Spike Detected"
