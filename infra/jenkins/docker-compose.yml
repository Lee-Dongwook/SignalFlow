services:
  docker:
    image: docker:27-dind
    container_name: signalflow-jenkins-docker
    privileged: true
    restart: unless-stopped
    environment:
      DOCKER_TLS_CERTDIR: /certs
    command: --storage-driver=overlay2
    networks:
      - jenkins
    volumes:
      - jenkins-docker-certs:/certs/client
      - jenkins-docker-data:/var/lib/docker

  jenkins:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: signalflow-jenkins
    depends_on:
      - docker
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DOCKER_HOST: tcp://docker:2376
      DOCKER_CERT_PATH: /certs/client
      DOCKER_TLS_VERIFY: "1"
    networks:
      - jenkins
    volumes:
      - jenkins-home:/var/jenkins_home
      - jenkins-docker-certs:/certs/client:ro

networks:
  jenkins:
    name: signalflow-jenkins

volumes:
  jenkins-home:
    name: signalflow-jenkins-home
  jenkins-docker-certs:
    name: signalflow-jenkins-docker-certs
  jenkins-docker-data:
    name: signalflow-jenkins-docker-data
